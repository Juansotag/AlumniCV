# Railway — Servicio Frontend (AlumniCV Web)
# Despliega el build estático de Vite/React.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npx serve dist --listen $PORT --no-clipboard"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Variables de entorno que DEBEN estar configuradas en Railway:
#
#   VITE_API_URL           → https://<tu-backend>.railway.app
#   VITE_SUPABASE_URL      → https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY → sb_publishable_...
