# Railway — Servicio Frontend (AlumniCV Web)
# Despliega el build estático de Vite/React.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[build.nixpacksPlan.variables]
NIXPACKS_NODE_VERSION = "22"

[deploy]
startCommand = "./node_modules/.bin/serve -s dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
